if (/\.github\.io$/.test(location.hostname)) location.replace("https://techdail.vercel.app/" + location.search + location.hash);

<script>
/* Apply saved style + theme BEFORE first paint (no flash) */
(function () {
  var FONTS = {
    classic: "Lora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600",
    glass: "Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600",
    pop: "Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600",
    brutal: "Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600"
  };
  try {
    var q = new URLSearchParams(location.search);
    if (q.has("owner")) {
      if (q.get("owner") === "0") localStorage.removeItem("dtd-owner"); else localStorage.setItem("dtd-owner", "1");
      history.replaceState(null, "", location.pathname + location.hash);
    }
    if (localStorage.getItem("dtd-owner") === "1") document.documentElement.setAttribute("data-owner", "");
  } catch (e) {}
  var s = "classic", t = null;
  try { s = localStorage.getItem("dtd-style") || "classic"; t = localStorage.getItem("dtd-theme"); } catch (e) {}
  if (!FONTS[s]) s = "classic";
  var dark = s === "classic" && (t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches);
  var h = document.documentElement;
  h.setAttribute("data-style", s);
  h.setAttribute("data-theme", dark ? "dark" : "light");
  window.__DTD_FONTS = FONTS;
  document.write('<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + FONTS[s] + '&display=swap">');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

        <svg class="ico ico-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="lbl">Refresh now</span>
      </button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode" title="Dark mode">
        <svg class="ico ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="ico ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
  <div class="progress" id="progress" hidden><span></span></div>
